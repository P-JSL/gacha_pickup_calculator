name: Weekly dependency security advisory check

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: RustSec advisory database against locked graph
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
  pillow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check Pillow against Python vulnerability advisory database
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements-image.txt
