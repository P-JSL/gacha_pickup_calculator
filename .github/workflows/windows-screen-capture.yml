name: Windows native UI screenshot investigation

on:
  pull_request:
    paths:
      - ".github/workflows/windows-screen-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download released v0.1.11 Windows application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Type Directory -Force screenshots | Out-Null
          gh release download v0.1.11 --repo P-JSL/gacha_pickup_calculator --pattern gacha_pickup_calculator.exe --dir .
          if (!(Test-Path gacha_pickup_calculator.exe)) { throw "Released EXE missing" }

      - name: Install software OpenGL (Mesa llvmpipe) next to executable
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          path: ${{ github.workspace }}

      - name: Capture Windows app screens at highest available display resolution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:RUST_BACKTRACE = "1"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class AppWindow {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint dx,uint dy,uint data,UIntPtr info);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd,int cmd);
          }
          '@
          Write-Host "Windows user $env:USERNAME, session $([Diagnostics.Process]::GetCurrentProcess().SessionId)"
          $before = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Before resolution: $before"
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            foreach ($size in @(@(1600,900), @(1920,1080), @(1536,864))) {
              try {
                Set-DisplayResolution -Width $size[0] -Height $size[1] -Force -ErrorAction Stop | Out-Host
                Start-Sleep -Seconds 2
                $changed = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                Write-Host "After resolution request: $changed"
                if ($changed.Width -ge 1536 -and $changed.Height -ge 864) { break }
              } catch {
                Write-Warning "Resolution $($size[0])x$($size[1]): $($_.Exception.Message)"
              }
            }
          } else {
            Write-Warning "Set-DisplayResolution is unavailable"
          }
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Screen for capturing: $bounds"
          $exe = Join-Path $pwd "gacha_pickup_calculator.exe"
          $stdout = Join-Path $pwd "screenshots\stdout.txt"
          $stderr = Join-Path $pwd "screenshots\stderr.txt"
          $app = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          function Save-Screen([string]$name) {
            $rectangle = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($rectangle.Width,$rectangle.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($rectangle.Location,[System.Drawing.Point]::Empty,$rectangle.Size)
              $output = Join-Path $pwd "screenshots\$name.png"
              $bitmap.Save($output,[System.Drawing.Imaging.ImageFormat]::Png)
              Write-Host "Saved actual Windows screenshot: $output ($($rectangle.Width)x$($rectangle.Height))"
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          }
          function Click-Nav([int]$y) {
            [AppWindow]::SetCursorPos(90,$y) | Out-Null
            [AppWindow]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
            [AppWindow]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
            Start-Sleep -Seconds 3
            [AppWindow]::SetCursorPos(950,30) | Out-Null
          }
          try {
            Start-Sleep -Seconds 9
            $app.Refresh()
            Write-Host "Process PID $($app.Id), window $($app.MainWindowHandle), alive $(!$app.HasExited)"
            if ($app.HasExited) {
              Write-Host "Exit code: $($app.ExitCode)"
              if (Test-Path $stderr) { Get-Content $stderr -Tail 60 }
              throw "Windows UI process terminated before screenshot"
            }
            [AppWindow]::ShowWindow($app.MainWindowHandle,3) | Out-Null
            [AppWindow]::SetForegroundWindow($app.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 3
            [AppWindow]::SetCursorPos(950,30) | Out-Null
            Save-Screen "windows-dashboard"
            Click-Nav 260
            Save-Screen "windows-simulator"
            Click-Nav 320
            Save-Screen "windows-currency"
            Click-Nav 500
            Save-Screen "windows-analytics"
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-ui-investigation
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7
