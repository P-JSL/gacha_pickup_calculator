name: Rust CI and Release

# A new commit supersedes earlier image downloads and UI builds on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux windowing prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Format Rust sources before verification
        run: cargo fmt --all
      - name: Unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: RustSec dependency vulnerability audit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Build release
        run: cargo build --release
      - name: Upload Linux executable for UI documentation screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gacha-linux-app
          path: target/release/gacha_pickup_calculator
          if-no-files-found: error
          retention-days: 7
      - name: Linux GUI startup smoke (virtual display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon-x11-0
          set +e
          timeout 8s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./target/release/gacha_pickup_calculator > /tmp/gacha-gui-smoke.log 2>&1
          result=$?
          set -e
          if [ "$result" != 124 ]; then
            echo "::error::GUI process did not remain running for the expected smoke-test interval; exit code $result"
            cat /tmp/gacha-gui-smoke.log
            exit 1
          fi
          echo "GUI stayed alive under virtual X11 display without crashing."
      - name: Capture dark-mode chart screenshot (Linux GUI)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y scrot xdotool python3-pil fonts-noto-cjk
          mkdir -p ci-artifacts
          xvfb-run -a -s '-screen 0 1536x864x24' bash -c '
            set -eu
            LIBGL_ALWAYS_SOFTWARE=1 ./target/release/gacha_pickup_calculator >/tmp/gacha-chart.log 2>&1 &
            app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            sleep 9
            xdotool mousemove 1470 27
            kill -0 "$app" || { cat /tmp/gacha-chart.log; exit 1; }
            scrot -q 90 ci-artifacts/initial.png
            # Settings is the second entry in the persistent navigation rail.
            # Capture its compact 2x2 editor layout before returning to charts.
            xdotool mousemove 95 225 click 1
            sleep 2
            scrot -q 90 ci-artifacts/settings.png
            xdotool mousemove 95 167 click 1
            sleep 2
            xdotool mousemove 1470 27
            xdotool click --repeat 7 --delay 125 5
            sleep 2
            scrot -q 90 ci-artifacts/overview.png
            # Verify the separate character/weapon cards further down the
            # dashboard instead of repeatedly capturing the top inputs.
            xdotool click --repeat 11 --delay 125 5
            sleep 2
            scrot -q 90 ci-artifacts/chart.png
          '
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("ci-artifacts/chart.png").convert("RGB")
          assert image.width >= 1200 and image.height >= 800, "Invalid screenshot"
          core = image.crop((150, 60, 1150, 850)).resize((100, 79))
          pixels = list(core.getdata())
          dark = sum(max(p) < 155 for p in pixels) / len(pixels)
          distinct = len(set(pixels))
          print(f"GUI screenshot dark-pixel ratio: {dark:.1%}; distinct colors: {distinct}")
          assert dark >= 0.55 and distinct >= 50, "GUI is not dark or screenshot is blank"
          PY
      - name: Upload Linux chart screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gacha-chart-visual-smoke-linux
          path: |
            ci-artifacts/initial.png
            ci-artifacts/settings.png
            ci-artifacts/overview.png
            ci-artifacts/chart.png
          if-no-files-found: error
          retention-days: 7
      - name: Windows native dark UI screenshot smoke
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force ci-artifacts | Out-Null
          $exe = Join-Path (Get-Location) 'target/release/gacha_pickup_calculator.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              # GitHub-hosted Windows service runners may lack an interactive
              # desktop / usable GPU context. Do not misreport this as a UI
              # screenshot passing or as an application functional regression.
              Write-Warning "Native Windows screenshot unavailable: process exited with $($process.ExitCode). CI is not a Windows interactive desktop."
              exit 0
            }
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            if ($bounds.Width -lt 500 -or $bounds.Height -lt 400) {
              throw "The hosted runner has no usable interactive desktop: $bounds"
            }
            $image = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($image)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $file = Join-Path (Get-Location) 'ci-artifacts/windows-ui.png'
              $image.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
              Write-Host "Windows native screenshot: $file ($($bounds.Width)x$($bounds.Height))"
            } finally {
              $graphics.Dispose()
              $image.Dispose()
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows UI screenshot
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gacha-windows-native-ui-smoke
          path: ci-artifacts/windows-ui.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Linux executable for real screenshot capture
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gacha-linux-release-executable
          path: target/release/gacha_pickup_calculator
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gacha-pickup-calculator-windows-x64
          path: target/release/gacha_pickup_calculator.exe
          if-no-files-found: error

  images:
    name: Build and scan offline image library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoder
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "Pillow==13.0.0"
      - name: Fetch, validate and re-encode all catalog images
        run: python3 scripts/build_offline_images.py
      - name: Scan all normalized images for malware
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam
          clamscan --recursive --infected dist/Image
      - uses: actions/upload-artifact@v4
        with:
          name: gacha-offline-images
          path: dist/Image/
          if-no-files-found: error

  docs_ui:
    name: Publish real screenshots to README asset directory
    needs: [images, verify]
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/offline-image-package-v014-20261106' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: gacha-linux-app
          path: app
      - uses: actions/download-artifact@v4
        with:
          name: gacha-offline-images
          path: app/Image
      - name: Capture actual simulator and settings UI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon-x11-0 scrot xdotool python3-pil fonts-noto-cjk
          chmod +x app/gacha_pickup_calculator
          mkdir -p ci-ui docs/images
          xvfb-run -a -s '-screen 0 1536x864x24' bash -c '
            set -eu
            LIBGL_ALWAYS_SOFTWARE=1 ./app/gacha_pickup_calculator >/tmp/docs-ui.log 2>&1 &
            app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            sleep 12
            kill -0 "$app" || { cat /tmp/docs-ui.log; exit 1; }
            xdotool mousemove 1480 25
            scrot -q 90 ci-ui/dashboard.png
            xdotool mousemove 95 228 click 1
            sleep 2
            scrot -q 90 ci-ui/simulator.png
            xdotool mousemove 95 286 click 1
            sleep 2
            scrot -q 90 ci-ui/currency.png
            xdotool mousemove 95 344 click 1
            sleep 3
            scrot -q 90 ci-ui/characters.png
            xdotool mousemove 95 399 click 1
            sleep 3
            scrot -q 90 ci-ui/weapons.png
            xdotool mousemove 95 458 click 1
            sleep 2
            scrot -q 90 ci-ui/analytics.png
            xdotool mousemove 95 549 click 1
            sleep 2
            scrot -q 90 ci-ui/settings.png
            xdotool mousemove 95 167 click 1
            sleep 2
            xdotool mousemove 722 389
            scrot -q 90 ci-ui/chart-hover.png
          '
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = ("dashboard", "simulator", "currency", "characters",
                      "weapons", "analytics", "settings", "chart-hover")
          for name in expected:
              source = Path("ci-ui") / f"{name}.png"
              with Image.open(source) as img:
                  if img.size != (1536, 864):
                      raise SystemExit(f"Unexpected live screenshot dimensions: {name} {img.size}")
                  image = img.convert("RGB")
                  out = Path("docs/images") / f"ui-{name}.webp"
                  image.save(out, "WEBP", quality=81, method=6)
                  if out.stat().st_size < 10_000:
                      raise SystemExit(f"UI image unexpectedly small: {out}")
                  print(f"Verified screenshot {out}: {out.stat().st_size} bytes")
          PY
      - name: Commit verified UI photos to the same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/ui-*.webp
          if git diff --cached --quiet; then
            echo "UI photos are already up to date."
          else
            git commit -m "docs(ui): update screenshots from actual v0.1.14 Linux GUI run"
            git push origin "HEAD:refs/heads/${{ github.head_ref }}"
          fi

  ui_docs:
    name: Capture latest-character GUI for README
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gacha-linux-release-executable
          path: target/release/
      - uses: actions/download-artifact@v4
        with:
          name: gacha-offline-images
          path: target/release/Image/
      - name: Actual Linux UI with packaged images
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb scrot xdotool python3-pil fonts-noto-cjk libgl1-mesa-dri libxkbcommon-x11-0
          chmod +x target/release/gacha_pickup_calculator
          bash scripts/capture_readme_screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gacha-readme-screenshots-v014
          path: ci-readme-shots/
          if-no-files-found: error
          retention-days: 14

  publish_docs:
    name: Commit real screenshots to README image directory
    needs: ui_docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: gacha-readme-screenshots-v014
          path: ci-readme-shots/
      - name: Record verified native GUI screenshots in Git
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          mkdir -p docs/screenshots/v0.1.14
          cp ci-readme-shots/*.png docs/screenshots/v0.1.14/
          git add docs/screenshots/v0.1.14/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]'                 -c user.email='41898282+github-actions[bot]@users.noreply.github.com'                 commit -m 'docs: publish verified v0.1.14 native GUI captures [skip ci]'
            git push origin HEAD:main
          fi

  release:
    name: Publish versioned release
    needs: [verify, images, ui_docs, publish_docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Existing release::$TAG is already published; change Cargo.toml version before releasing again."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG exists without a release. Refusing an ambiguous overwrite."
              exit 1
            fi
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: gacha-pickup-calculator-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: gacha-offline-images
          path: dist/Image
      - name: Check release notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test -s "RELEASE_NOTES_v${VERSION}.md"
      - name: Prepare and verify release assets
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/gacha_pickup_calculator.exe
          git archive --format=zip -o "dist/gacha-pickup-calculator-source-v$VERSION.zip" HEAD
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          version = os.environ["VERSION"]
          executable = Path("dist/gacha_pickup_calculator.exe")
          if executable.stat().st_size < 100_000:
              raise SystemExit("Windows executable is unexpectedly small.")
          package = Path(f"dist/gacha-pickup-calculator-windows-x64-v{version}.zip")
          icons = sorted(Path("dist/Image").rglob("*.png"))
          expected = sum(1 for line in Path("src/catalog_data.tsv").read_text(
              encoding="utf-8").splitlines() if len(line.split("\t")) == 6)
          if len(icons) != expected or expected < 680:
              raise SystemExit(f"Incomplete sanitized assets: {len(icons)}/{expected}")
          with ZipFile(package, "w", compression=ZIP_DEFLATED, compresslevel=9) as zipped:
              zipped.write(executable, executable.name)
              for icon in icons:
                  zipped.write(icon, icon.relative_to("dist").as_posix())
              zipped.write("dist/Image/SHA256SUMS.txt", "Image/SHA256SUMS.txt")
              zipped.writestr("README.txt",
                  "Gacha Pickup Calculator / Windows x64\n"
                  "Extract this entire ZIP, preserving the Image directory.\n"
                  "Run gacha_pickup_calculator.exe alongside the Image folder.\n"
                  "All image files were decoded, re-encoded and malware-scanned in CI.\n"
                  "No image network requests are performed while using the app.\n")
          with ZipFile(package) as zipped:
              assert zipped.testzip() is None
              assert executable.name in zipped.namelist()
              assert len([n for n in zipped.namelist()
                  if n.startswith("Image/") and n.endswith(".png")]) == len(icons)
              assert "Image/SHA256SUMS.txt" in zipped.namelist()
          PY
          cd dist
          sha256sum gacha_pickup_calculator.exe \
            "gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "gacha-pickup-calculator-source-v$VERSION.zip" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish release and validate asset list
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/gacha_pickup_calculator.exe \
            "dist/gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "dist/gacha-pickup-calculator-source-v$VERSION.zip" \
            dist/SHA256SUMS.txt \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG — Rust Gacha Pickup Calculator" \
            --notes-file "RELEASE_NOTES_v$VERSION.md"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          for asset in gacha_pickup_calculator.exe \
            "gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "gacha-pickup-calculator-source-v$VERSION.zip" SHA256SUMS.txt; do
            grep -Fx -- "$asset" actual-assets.txt >/dev/null || {
              echo "::error::Missing release asset: $asset"
              exit 1
            }
          done
          echo "::notice title=Release published::$TAG has all four expected assets."
