name: Rust CI and Release

# A new commit supersedes earlier image downloads and UI builds on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - name: Linux windowing prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Format Rust sources before verification
        run: cargo fmt --all
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: RustSec dependency vulnerability audit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Build release
        run: cargo build --locked --release
      - name: Linux GUI startup smoke (virtual display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon-x11-0
          set +e
          timeout 8s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./target/release/gacha_pickup_calculator > /tmp/gacha-gui-smoke.log 2>&1
          result=$?
          set -e
          if [ "$result" != 124 ]; then
            echo "::error::GUI process did not remain running for the expected smoke-test interval; exit code $result"
            cat /tmp/gacha-gui-smoke.log
            exit 1
          fi
          echo "GUI stayed alive under virtual X11 display without crashing."
      # Native Linux GUI startup was checked above. A fresh dedicated ui_docs
      # runner below captures all nine real GUI screenshots after both OS builds.
      # Avoid running a second Xvfb/scrot session in this verification job.
      - name: Windows native dark UI screenshot smoke
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force ci-artifacts | Out-Null
          $exe = Join-Path (Get-Location) 'target/release/gacha_pickup_calculator.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              # GitHub-hosted Windows service runners may lack an interactive
              # desktop / usable GPU context. Do not misreport this as a UI
              # screenshot passing or as an application functional regression.
              Write-Warning "Native Windows screenshot unavailable: process exited with $($process.ExitCode). CI is not a Windows interactive desktop."
              exit 0
            }
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            if ($bounds.Width -lt 500 -or $bounds.Height -lt 400) {
              throw "The hosted runner has no usable interactive desktop: $bounds"
            }
            $image = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($image)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $file = Join-Path (Get-Location) 'ci-artifacts/windows-ui.png'
              $image.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
              Write-Host "Windows native screenshot: $file ($($bounds.Width)x$($bounds.Height))"
            } finally {
              $graphics.Dispose()
              $image.Dispose()
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows UI screenshot
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-windows-native-ui-smoke
          path: ci-artifacts/windows-ui.png
          # The hosted Windows runner has no guaranteed interactive display.
          # GUI capture is diagnostic, whereas build/tests remain mandatory.
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Linux executable for real screenshot capture
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-linux-release-executable
          path: target/release/gacha_pickup_calculator
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-pickup-calculator-windows-x64
          path: target/release/gacha_pickup_calculator.exe
          if-no-files-found: error

  images:
    name: Audit and scan checked-in offline images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify immutable checked-in PNG assets
        run: python3 scripts/verify_embedded_assets.py
      - name: Scan vendored images for known malware
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam
          clamscan --recursive --infected Image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-offline-images
          path: Image/
          if-no-files-found: error

  ui_docs:
    name: Capture latest-character GUI for README
    needs: [verify, images]
    runs-on: ubuntu-24.04
    # Screenshot capture is never allowed to hang and block release forever.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: gacha-linux-release-executable
          path: target/release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: gacha-offline-images
          path: target/release/Image/
      - name: Actual Linux UI with packaged images
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=GUI capture::Installing screenshot prerequisites with bounded timeouts."
          timeout --signal=TERM --kill-after=10s 180s sudo apt-get update
          timeout --signal=TERM --kill-after=10s 180s sudo apt-get install -y xvfb scrot xdotool python3-pil fonts-noto-cjk libgl1-mesa-dri libxkbcommon-x11-0
          chmod +x target/release/gacha_pickup_calculator
          echo "::notice title=GUI capture::Starting actual GUI screenshots with a 3-minute limit."
          timeout --signal=TERM --kill-after=10s 180s bash scripts/capture_readme_screenshots.sh
          echo "::notice title=GUI capture::Screenshot capture and PNG checks completed."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-readme-screenshots
          path: ci-readme-shots/
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish versioned release
    needs: [verify, images, ui_docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Check version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Existing release::$TAG is already published; change Cargo.toml version before releasing again."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG exists without a release. Refusing an ambiguous overwrite."
              exit 1
            fi
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.version.outputs.publish == 'true'
        with:
          name: gacha-pickup-calculator-windows-x64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.version.outputs.publish == 'true'
        with:
          name: gacha-offline-images
          path: dist/Image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.version.outputs.publish == 'true'
        with:
          name: gacha-readme-screenshots
          path: dist/screenshots
      - name: Check release notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test -s "RELEASE_NOTES_v${VERSION}.md"
      - name: Prepare and verify release assets
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/gacha_pickup_calculator.exe
          git archive --format=zip -o "dist/gacha-pickup-calculator-source-v$VERSION.zip" HEAD
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          version = os.environ["VERSION"]
          executable = Path("dist/gacha_pickup_calculator.exe")
          if executable.stat().st_size < 100_000:
              raise SystemExit("Windows executable is unexpectedly small.")
          package = Path(f"dist/gacha-pickup-calculator-windows-x64-v{version}.zip")
          icons = sorted(Path("dist/Image").rglob("*.png"))
          expected = sum(1 for line in Path("src/catalog_data.tsv").read_text(
              encoding="utf-8").splitlines() if len(line.split("\t")) == 6)
          if len(icons) != expected or expected < 670:
              raise SystemExit(f"Incomplete sanitized assets: {len(icons)}/{expected}")
          with ZipFile(package, "w", compression=ZIP_DEFLATED, compresslevel=9) as zipped:
              zipped.write(executable, executable.name)
              for icon in icons:
                  zipped.write(icon, icon.relative_to("dist").as_posix())
              zipped.write("dist/Image/SHA256SUMS.txt", "Image/SHA256SUMS.txt")
              zipped.writestr("README.txt",
                  "Gacha Pickup Calculator / Windows x64\n"
                  "Extract this entire ZIP, preserving the Image directory.\n"
                  "Run gacha_pickup_calculator.exe alongside the Image folder.\n"
                  "All image files were decoded, re-encoded and malware-scanned in CI.\n"
                  "No image network requests are performed while using the app.\n")
          with ZipFile(package) as zipped:
              assert zipped.testzip() is None
              assert executable.name in zipped.namelist()
              assert len([n for n in zipped.namelist()
                  if n.startswith("Image/") and n.endswith(".png")]) == len(icons)
              assert "Image/SHA256SUMS.txt" in zipped.namelist()
          screenshots = sorted(Path("dist/screenshots").glob("*.png"))
          if len(screenshots) < 9:
              raise SystemExit(f"Insufficient captured GUI screenshots: {len(screenshots)}")
          screenshot_zip = Path(f"dist/gacha-pickup-calculator-screenshots-v{version}.zip")
          with ZipFile(screenshot_zip, "w", compression=ZIP_DEFLATED) as zipped:
              for screenshot in screenshots:
                  zipped.write(screenshot, screenshot.name)
          with ZipFile(screenshot_zip) as zipped:
              assert zipped.testzip() is None
              assert len(zipped.namelist()) == len(screenshots)
          PY
          cd dist
          sha256sum gacha_pickup_calculator.exe \
            "gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "gacha-pickup-calculator-source-v$VERSION.zip" \
            "gacha-pickup-calculator-screenshots-v$VERSION.zip" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish release and validate asset list
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/gacha_pickup_calculator.exe \
            "dist/gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "dist/gacha-pickup-calculator-source-v$VERSION.zip" \
            "dist/gacha-pickup-calculator-screenshots-v$VERSION.zip" \
            dist/SHA256SUMS.txt \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG — Rust Gacha Pickup Calculator" \
            --notes-file "RELEASE_NOTES_v$VERSION.md"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          for asset in gacha_pickup_calculator.exe \
            "gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "gacha-pickup-calculator-source-v$VERSION.zip" \
            "gacha-pickup-calculator-screenshots-v$VERSION.zip" SHA256SUMS.txt; do
            grep -Fx -- "$asset" actual-assets.txt >/dev/null || {
              echo "::error::Missing release asset: $asset"
              exit 1
            }
          done
          echo "::notice title=Release published::$TAG has all five expected assets."
