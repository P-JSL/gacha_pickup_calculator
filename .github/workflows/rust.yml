name: Rust CI and Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux windowing prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Format Rust sources before verification
        run: cargo fmt --all
      - name: Unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gacha-pickup-calculator-windows-x64
          path: target/release/gacha_pickup_calculator.exe
          if-no-files-found: error

  release:
    name: Publish v0.1.0 release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gacha-pickup-calculator-windows-x64
          path: dist
      - name: Prepare source archive
        run: |
          git archive --format=zip -o dist/gacha-pickup-calculator-source-v0.1.0.zip HEAD
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish release only after successful builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists; not overwriting.'
            exit 0
          fi
          gh release create v0.1.0 dist/gacha_pickup_calculator.exe dist/gacha-pickup-calculator-source-v0.1.0.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'v0.1.0 — Rust Markov DP Calculator' \
            --notes 'Initial four-game desktop release: Honkai Star Rail, Wuthering Waves, Neverness to Everness, Stella Sora. Estimates and limitations are documented in README.'
