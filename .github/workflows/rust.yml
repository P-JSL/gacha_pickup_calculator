name: Rust CI and Release

# Supersede older PR attempts, never interrupt an in-progress main release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  classify:
    name: Classify CI scope
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.scope.outputs.build }}
      images: ${{ steps.scope.outputs.images }}
      ui: ${{ steps.scope.outputs.ui }}
      perf: ${{ steps.scope.outputs.perf }}
      audit: ${{ steps.scope.outputs.audit }}
      doc_api: ${{ steps.scope.outputs.doc_api }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Determine necessary checks (fail closed on unknown paths)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=false; images=false; ui=false; perf=false; audit=false; doc_api=false; release=false
          unknown=false
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            unknown=true
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || unknown=true
          fi
          if [[ "$unknown" != true ]]; then
            git diff --name-only --diff-filter=ACDMRT -z "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths" || unknown=true
          fi
          if [[ "$unknown" == true ]]; then
            echo "::warning::Cannot reliably determine changed files; running all applicable checks."
            build=true; images=true; ui=true; perf=true; audit=true; doc_api=true
          else
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|LICENSE|THIRD_PARTY_ASSETS.md|docs/*.md|RELEASE_NOTES_v*.md)
                  continue ;;
              esac
              build=true
              case "$path" in
                Image/*|src/catalog_data.tsv|src/signature_pairs.tsv|src/unpaired_five_star_targets.tsv|scripts/verify_embedded_assets.py|scripts/build_offline_images.py|scripts/pinned_icon_sources.py)
                  images=true; ui=true ;;
                src/ui/*|src/app/*|src/main.rs|src/data/*|scripts/capture_readme_screenshots.sh)
                  ui=true ;;
                src/probability/*|src/domain/*|src/analysis/*|src/lib.rs)
                  perf=true; audit=true; doc_api=true ;;
                tests/performance_regression.rs)
                  perf=true ;;
                tests/*)
                  ;;
                Cargo.toml|Cargo.lock|.github/workflows/*)
                  images=true; ui=true; perf=true; audit=true; doc_api=true ;;
                *)
                  images=true; ui=true; perf=true; audit=true; doc_api=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
            if ! gh release view "v$version" >/dev/null 2>&1; then
              release=true; build=true; images=true; ui=true; perf=true; audit=true; doc_api=true
            fi
          fi
          {
            echo "build=$build"; echo "images=$images"; echo "ui=$ui"
            echo "perf=$perf"; echo "audit=$audit"; echo "doc_api=$doc_api"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "CI scope: build=$build images=$images ui=$ui perf=$perf audit=$audit docs=$doc_api release=$release"

  docs:
    name: Validate documentation and release contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check local links, release version and module references
        run: python3 scripts/verify_release_contract.py

  verify:
    name: Verify (${{ matrix.os }})
    needs: classify
    # The matrix must exist even for docs-only PRs: Rulesets may require the
    # exact per-OS contexts, which disappear if the whole matrix is skipped.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Documentation-only fast path
        if: needs.classify.outputs.build != 'true'
        run: echo "No executable inputs changed; Rust compile steps are unnecessary."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.classify.outputs.build == 'true'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        if: needs.classify.outputs.build == 'true'
        with:
          components: rustfmt, clippy
      - name: Linux windowing prerequisites
        if: runner.os == 'Linux' && needs.classify.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Format Rust sources before verification
        if: needs.classify.outputs.build == 'true'
        run: cargo fmt --all
      - name: Unit tests
        if: needs.classify.outputs.build == 'true'
        run: cargo test --locked --all-targets
      - name: Clippy
        if: needs.classify.outputs.build == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Public API documentation build
        if: runner.os == 'Linux' && needs.classify.outputs.build == 'true' && needs.classify.outputs.doc_api == 'true'
        run: cargo doc --locked --no-deps --lib
  build_linux:
    name: Build Linux GUI executable
    needs: classify
    if: needs.classify.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Linux windowing prerequisites
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Build release
        run: cargo build --locked --release
      - name: Linux GUI startup smoke (virtual display)
        if: runner.os == 'Linux' && needs.classify.outputs.build == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon-x11-0
          set +e
          timeout 8s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./target/release/gacha_pickup_calculator > /tmp/gacha-gui-smoke.log 2>&1
          result=$?
          set -e
          if [ "$result" != 124 ]; then
            echo "::error::GUI process did not remain running for the expected smoke-test interval; exit code $result"
            cat /tmp/gacha-gui-smoke.log
            exit 1
          fi
          echo "GUI stayed alive under virtual X11 display without crashing."
      # Captured UI screenshots only need the Linux executable, not the
      # completion of Windows tests/build or of independent security jobs.
      - name: Upload Linux executable for real screenshot capture
        if: runner.os == 'Linux' && needs.classify.outputs.build == 'true' && needs.classify.outputs.ui == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-linux-release-executable
          path: target/release/gacha_pickup_calculator
          if-no-files-found: error
          retention-days: 7

  build_windows:
    name: Build Windows release executable
    needs: classify
    if: needs.classify.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Build release
        run: cargo build --locked --release
      - name: Optional trusted Authenticode signing (requires protected certificate secrets)
        if: runner.os == 'Windows' && needs.classify.outputs.build == 'true' && needs.classify.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WIN_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WIN_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./scripts/sign_windows_release.ps1
      - name: Windows native dark UI screenshot smoke
        if: runner.os == 'Windows' && needs.classify.outputs.build == 'true' && needs.classify.outputs.ui == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force ci-artifacts | Out-Null
          $exe = Join-Path (Get-Location) 'target/release/gacha_pickup_calculator.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              # GitHub-hosted Windows service runners may lack an interactive
              # desktop / usable GPU context. Do not misreport this as a UI
              # screenshot passing or as an application functional regression.
              Write-Warning "Native Windows screenshot unavailable: process exited with $($process.ExitCode). CI is not a Windows interactive desktop."
              exit 0
            }
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            if ($bounds.Width -lt 500 -or $bounds.Height -lt 400) {
              throw "The hosted runner has no usable interactive desktop: $bounds"
            }
            $image = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($image)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $file = Join-Path (Get-Location) 'ci-artifacts/windows-ui.png'
              $image.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
              Write-Host "Windows native screenshot: $file ($($bounds.Width)x$($bounds.Height))"
            } finally {
              $graphics.Dispose()
              $image.Dispose()
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows UI screenshot
        if: runner.os == 'Windows' && needs.classify.outputs.build == 'true' && needs.classify.outputs.ui == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-windows-native-ui-smoke
          path: ci-artifacts/windows-ui.png
          # The hosted Windows runner has no guaranteed interactive display.
          # GUI capture is diagnostic, whereas build/tests remain mandatory.
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Windows app
        if: runner.os == 'Windows' && needs.classify.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-pickup-calculator-windows-x64
          path: target/release/gacha_pickup_calculator.exe
          if-no-files-found: error

  # Independent functional gates run in parallel with tests and release builds.
  # Separate runners also prevent cargo-audit installation and the antivirus
  # mirror download from delaying the GUI and Windows release builds.
  rustsec:
    name: RustSec dependency audit
    needs: classify
    if: needs.classify.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Audit locked dependencies against RustSec advisories
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  performance:
    name: Measure probability performance
    needs: classify
    if: needs.classify.outputs.perf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Install Linux compilation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Compare optimized FFT and quantiles against exact reference
        run: cargo test --locked --release --test performance_regression -- --ignored --nocapture

  image_integrity:
    name: Verify bundled image integrity
    needs: classify
    if: needs.classify.outputs.images == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify immutable checked-in PNG assets
        run: python3 scripts/verify_embedded_assets.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-offline-images
          path: Image/
          if-no-files-found: error

  images:
    name: Audit and scan checked-in offline images
    needs: classify
    if: needs.classify.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scan vendored images for known malware
        shell: bash
        run: |
          set -euo pipefail
          # apt signatures remain checked. Prefer the official Ubuntu archive
          # when the Azure mirror is unavailable or slow on hosted runners.
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 install -y --no-install-recommends clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam
          clamscan --recursive --infected Image

  ui_docs:
    name: Capture latest-character GUI for README
    needs: [classify, build_linux]
    if: needs.classify.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    # Screenshot capture is never allowed to hang and block release forever.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: gacha-linux-release-executable
          path: target/release/
      # Use checked-in, previously validated images instead of a duplicate download.
      - name: Use checked-in image assets for screenshots
        run: cp -a Image target/release/Image
      - name: Actual Linux UI with packaged images
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=GUI capture::Installing screenshot prerequisites with bounded timeouts."
          timeout --signal=TERM --kill-after=10s 180s sudo apt-get update
          # Azure's Ubuntu mirror can take >180s to deliver 10MB of CJK fonts.
          # Retry on the public Ubuntu mirror instead of publishing a release
          # with missing real GUI screenshots. Both attempts are time-bounded.
          if ! timeout --signal=TERM --kill-after=10s 220s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 install -y --no-install-recommends xvfb scrot xdotool python3-pil fonts-nanum libgl1-mesa-dri libxkbcommon-x11-0; then
            echo "::warning title=Slow apt mirror::Retrying capture dependencies via the public Ubuntu archive mirror."
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            timeout --signal=TERM --kill-after=10s 120s sudo apt-get update
            timeout --signal=TERM --kill-after=10s 420s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 install -y --no-install-recommends xvfb scrot xdotool python3-pil fonts-nanum libgl1-mesa-dri libxkbcommon-x11-0
          fi
          test -s /usr/share/fonts/truetype/nanum/NanumGothic.ttf
          chmod +x target/release/gacha_pickup_calculator
          python3 -m unittest discover -s scripts -p 'test_ui_capture_controls.py' -v
          echo "::notice title=GUI capture::Clicking Run Simulation and watching real worker completion."
          timeout --signal=TERM --kill-after=10s 180s bash scripts/capture_readme_screenshots.sh
          echo "::notice title=GUI capture::Screenshot capture and PNG checks completed."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gacha-readme-screenshots
          path: ci-readme-shots/
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish versioned release
    # New releases cannot publish until ALL parallel security, numeric, image
    # and GUI gates succeed. Docs-only / existing-version pushes skip safely.
    needs: [classify, docs, verify, build_linux, build_windows, rustsec, performance, image_integrity, images, ui_docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Check version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Existing release::$TAG is already published; change Cargo.toml version before releasing again."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG exists without a release. Refusing an ambiguous overwrite."
              exit 1
            fi
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.version.outputs.publish == 'true'
        with:
          name: gacha-pickup-calculator-windows-x64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.version.outputs.publish == 'true'
        with:
          name: gacha-offline-images
          path: dist/Image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.version.outputs.publish == 'true'
        with:
          name: gacha-readme-screenshots
          path: dist/screenshots
      - name: Check release notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test -s "RELEASE_NOTES_v${VERSION}.md"
      - name: Prepare and verify release assets
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/gacha_pickup_calculator.exe
          git archive --format=zip -o "dist/gacha-pickup-calculator-source-v$VERSION.zip" HEAD
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          version = os.environ["VERSION"]
          executable = Path("dist/gacha_pickup_calculator.exe")
          if executable.stat().st_size < 100_000:
              raise SystemExit("Windows executable is unexpectedly small.")
          package = Path(f"dist/gacha-pickup-calculator-windows-x64-v{version}.zip")
          icons = sorted(Path("dist/Image").rglob("*.png"))
          expected = sum(1 for line in Path("src/catalog_data.tsv").read_text(
              encoding="utf-8").splitlines() if len(line.split("\t")) == 6)
          if len(icons) != expected or expected < 670:
              raise SystemExit(f"Incomplete sanitized assets: {len(icons)}/{expected}")
          with ZipFile(package, "w", compression=ZIP_DEFLATED, compresslevel=9) as zipped:
              zipped.write(executable, executable.name)
              for icon in icons:
                  zipped.write(icon, icon.relative_to("dist").as_posix())
              zipped.write("dist/Image/SHA256SUMS.txt", "Image/SHA256SUMS.txt")
              zipped.writestr("README.txt",
                  "Gacha Pickup Calculator / Windows x64\n"
                  "Extract this entire ZIP, preserving the Image directory.\n"
                  "Run gacha_pickup_calculator.exe alongside the Image folder.\n"
                  "Bundled images were hash-verified and malware-scanned in CI.\n"
                  "The app may fetch verified updated images over HTTPS.\n")
          with ZipFile(package) as zipped:
              assert zipped.testzip() is None
              assert executable.name in zipped.namelist()
              assert len([n for n in zipped.namelist()
                  if n.startswith("Image/") and n.endswith(".png")]) == len(icons)
              assert "Image/SHA256SUMS.txt" in zipped.namelist()
          screenshots = sorted(Path("dist/screenshots").glob("*.png"))
          if len(screenshots) < 9:
              raise SystemExit(f"Insufficient captured GUI screenshots: {len(screenshots)}")
          screenshot_zip = Path(f"dist/gacha-pickup-calculator-screenshots-v{version}.zip")
          with ZipFile(screenshot_zip, "w", compression=ZIP_DEFLATED) as zipped:
              for screenshot in screenshots:
                  zipped.write(screenshot, screenshot.name)
          with ZipFile(screenshot_zip) as zipped:
              assert zipped.testzip() is None
              assert len(zipped.namelist()) == len(screenshots)
          PY
          cd dist
          sha256sum gacha_pickup_calculator.exe \
            "gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "gacha-pickup-calculator-source-v$VERSION.zip" \
            "gacha-pickup-calculator-screenshots-v$VERSION.zip" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      # OIDC/Sigstore provenance signs build identity without a repository PFX.
      # Sign and verify *final* packaged bytes before the assets are published.
      - name: Attest five release artifacts with GitHub OIDC and Sigstore
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/gacha_pickup_calculator.exe
            dist/gacha-pickup-calculator-windows-x64-v${{ steps.version.outputs.version }}.zip
            dist/gacha-pickup-calculator-source-v${{ steps.version.outputs.version }}.zip
            dist/gacha-pickup-calculator-screenshots-v${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
      - name: Verify signed provenance before publishing
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/gacha_pickup_calculator.exe \
            "dist/gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "dist/gacha-pickup-calculator-source-v$VERSION.zip" \
            "dist/gacha-pickup-calculator-screenshots-v$VERSION.zip" \
            dist/SHA256SUMS.txt; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/rust.yml"
          done
      - name: Publish release and validate asset list
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Immutable releases require all assets before publication.
          # A failed assertion leaves a draft instead of publishing a partial release.
          gh release create "$TAG" --draft \
            dist/gacha_pickup_calculator.exe \
            "dist/gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "dist/gacha-pickup-calculator-source-v$VERSION.zip" \
            "dist/gacha-pickup-calculator-screenshots-v$VERSION.zip" \
            dist/SHA256SUMS.txt \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG — Rust Gacha Pickup Calculator" \
            --notes-file "RELEASE_NOTES_v$VERSION.md"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          for asset in gacha_pickup_calculator.exe \
            "gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "gacha-pickup-calculator-source-v$VERSION.zip" \
            "gacha-pickup-calculator-screenshots-v$VERSION.zip" SHA256SUMS.txt; do
            grep -Fx -- "$asset" actual-assets.txt >/dev/null || {
              echo "::error::Missing release asset: $asset"
              exit 1
            }
          done
          echo "::notice title=Draft complete::$TAG has all five expected assets; publishing now."
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -Fx false >/dev/null
          echo "::notice title=Release published::$TAG has all five expected assets."
