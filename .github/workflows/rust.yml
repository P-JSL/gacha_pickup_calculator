name: Rust CI and Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux windowing prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Format Rust sources before verification
        run: cargo fmt --all
      - name: Unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release
      - name: Linux GUI startup smoke (virtual display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon-x11-0
          set +e
          timeout 8s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./target/release/gacha_pickup_calculator > /tmp/gacha-gui-smoke.log 2>&1
          result=$?
          set -e
          if [ "$result" != 124 ]; then
            echo "::error::GUI process did not remain running for the expected smoke-test interval; exit code $result"
            cat /tmp/gacha-gui-smoke.log
            exit 1
          fi
          echo "GUI stayed alive under virtual X11 display without crashing."
      - name: Capture dark-mode chart screenshot (Linux GUI)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y scrot xdotool python3-pil
          mkdir -p ci-artifacts
          xvfb-run -a -s '-screen 0 1440x960x24' bash -c '
            set -eu
            LIBGL_ALWAYS_SOFTWARE=1 ./target/release/gacha_pickup_calculator >/tmp/gacha-chart.log 2>&1 &
            app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            sleep 9
            kill -0 "$app" || { cat /tmp/gacha-chart.log; exit 1; }
            xdotool mousemove 850 700
            xdotool click --repeat 7 --delay 125 5
            sleep 2
            scrot -q 90 ci-artifacts/chart.png
          '
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("ci-artifacts/chart.png").convert("RGB")
          assert image.width >= 1200 and image.height >= 900, "Invalid screenshot"
          core = image.crop((150, 60, 1150, 850)).resize((100, 79))
          pixels = list(core.getdata())
          dark = sum(max(p) < 155 for p in pixels) / len(pixels)
          distinct = len(set(pixels))
          print(f"GUI screenshot dark-pixel ratio: {dark:.1%}; distinct colors: {distinct}")
          assert dark >= 0.55 and distinct >= 50, "GUI is not dark or screenshot is blank"
          PY
      - name: Upload Linux chart screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gacha-chart-visual-smoke-linux
          path: ci-artifacts/chart.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gacha-pickup-calculator-windows-x64
          path: target/release/gacha_pickup_calculator.exe
          if-no-files-found: error

  release:
    name: Publish versioned release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Existing release::$TAG is already published; change Cargo.toml version before releasing again."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG exists without a release. Refusing an ambiguous overwrite."
              exit 1
            fi
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: gacha-pickup-calculator-windows-x64
          path: dist
      - name: Prepare and verify release assets
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/gacha_pickup_calculator.exe
          git archive --format=zip -o "dist/gacha-pickup-calculator-source-v$VERSION.zip" HEAD
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          version = os.environ["VERSION"]
          executable = Path("dist/gacha_pickup_calculator.exe")
          if executable.stat().st_size < 100_000:
              raise SystemExit("Windows executable is unexpectedly small.")
          package = Path(f"dist/gacha-pickup-calculator-windows-x64-v{version}.zip")
          with ZipFile(package, "w", compression=ZIP_DEFLATED, compresslevel=9) as zipped:
              zipped.write(executable, executable.name)
              zipped.writestr("README.txt", "Gacha Pickup Calculator\nRun gacha_pickup_calculator.exe on Windows x64.\nThe ZIP contains the same executable as the standalone release asset.\n")
          with ZipFile(package) as zipped:
              assert zipped.testzip() is None
              assert executable.name in zipped.namelist()
          PY
          cd dist
          sha256sum gacha_pickup_calculator.exe \
            "gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "gacha-pickup-calculator-source-v$VERSION.zip" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish release and validate asset list
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/gacha_pickup_calculator.exe \
            "dist/gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "dist/gacha-pickup-calculator-source-v$VERSION.zip" \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$TAG — Rust Gacha Pickup Calculator" \
            --notes "Windows x64 executable and portable ZIP; Rust source archive and SHA-256 checksums. Windows GUI interactive startup has not been tested in CI."
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          for asset in gacha_pickup_calculator.exe \
            "gacha-pickup-calculator-windows-x64-v$VERSION.zip" \
            "gacha-pickup-calculator-source-v$VERSION.zip" SHA256SUMS.txt; do
            grep -Fx -- "$asset" actual-assets.txt >/dev/null || {
              echo "::error::Missing release asset: $asset"
              exit 1
            }
          done
          echo "::notice title=Release published::$TAG has all four expected assets."
