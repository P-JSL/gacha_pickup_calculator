name: Bootstrap Rust sources
on:
  push:
    paths:
      - gacha_source_bootstrap.tar.xz
permissions:
  contents: write
jobs:
  unpack-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: tar -xJf gacha_source_bootstrap.tar.xz --strip-components=1
      - name: Publish extracted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml README.md src .gitignore .github/workflows/rust.yml
          git rm gacha_source_bootstrap.tar.xz .github/workflows/bootstrap.yml
          git commit -m "feat: implement four-game Rust Markov DP calculator with GUI"
          git push
