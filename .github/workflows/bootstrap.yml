name: Bootstrap Rust sources
on:
  push:
    paths:
      - gacha_source_bootstrap.tar.xz
permissions:
  contents: write
jobs:
  unpack-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux windowing prerequisites
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Extract source
        run: tar -xJf gacha_source_bootstrap.tar.xz --strip-components=1
      - name: Validate
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Publish extracted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml README.md src tests .gitignore .github/workflows/rust.yml
          git rm gacha_source_bootstrap.tar.xz .github/workflows/bootstrap.yml
          git commit -m "feat: add four-game Markov DP calculator and Rust GUI"
          git push
