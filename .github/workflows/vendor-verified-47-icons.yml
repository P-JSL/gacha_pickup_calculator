name: Vendor three identity-reviewed 4.7 HSR icons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-verified-47-icons.yml

permissions:
  contents: write

concurrency:
  group: vendor-reviewed-47-icons
  cancel-in-progress: false

jobs:
  vendor:
    if: github.repository == 'P-JSL/gacha_pickup_calculator'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install fixed image decoder
        run: python3 -m pip install --disable-pip-version-check -r requirements-image.txt
      - name: Retrieve only three pinned icon sources and normalize to local PNG
        run: python3 scripts/vendor_verified_47_icons.py
      - name: Audit all 679 PNG hashes, source IDs, and character-equipment pairs
        run: python3 scripts/verify_embedded_assets.py
      - name: Publish checked-in, source-reviewed PNG assets
        shell: bash
        run: |
          set -euo pipefail
          git add Image/HSR/c-1511.png Image/HSR/w-22009.png Image/HSR/w-23065.png Image/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "::error::Expected image replacements were not staged."
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'assets: replace 4.7 HSR placeholder art with reviewed icons'
          git push origin HEAD:main
