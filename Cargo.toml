[package]
name = "gacha_pickup_calculator"
version = "0.1.14"
edition = "2021"
license = "MIT"
description = "Exact finite-state gacha probability calculator for four games"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.31.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
lto = "thin"
codegen-units = 1