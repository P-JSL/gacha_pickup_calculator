[package]
name = "gacha_pickup_calculator"
version = "1.0.1"
edition = "2021"
license = "MIT"
description = "Desktop probability and resource estimator for four gacha games"
repository = "https://github.com/P-JSL/gacha_pickup_calculator"
readme = "README.md"
keywords = ["probability", "simulation", "gacha", "egui"]
categories = ["games", "science"]

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "0.31.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1